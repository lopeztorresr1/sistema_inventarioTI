name: Generar Release Notes

on:
  push:
    tags:
      - 'v*.*.*' # Se activa al subir un tag de versión


permissions:
  contents: write

jobs:
  crear-release:
    name: Crear Release Automático
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Publicar Release y Auto-generar Notas
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true 