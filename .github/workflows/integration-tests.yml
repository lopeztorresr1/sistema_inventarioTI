name: Pruebas de Integración con MySQL

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend-db:
    name: Pruebas de Go con MySQL Real
    runs-on: ubuntu-latest

    # 1. DEFINIR EL SERVICIO (Base de datos temporal)
    services:
      mysql_temporal:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password_secreto
          MYSQL_DATABASE: inventarioti_db
        ports:
          - 3306:3306
        # Esto asegura que GitHub espere a que MySQL esté completamente listo antes de avanzar
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21' # Ajusta si estás usando otra versión

    - name: Descargar dependencias
      run: go mod download

    # 2. EJECUTAR LAS PRUEBAS INYECTANDO LAS CREDENCIALES
    - name: Ejecutar pruebas de Go conectadas a MySQL
      env:
        # Aquí pasamos las variables de entorno para que tu conexión en internal/database/database.go 
        # apunte a esta base de datos temporal en lugar de a tu servidor local.
        DB_USER: root
        DB_PASSWORD: password_secreto
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_NAME: inventarioti_db
      run: go test -v ./...